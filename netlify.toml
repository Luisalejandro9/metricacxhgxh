[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy inverso transparente para omitir bloqueos DNS de redes corporativas (Konecta)
# Las peticiones a /supabase/* y /auth/v1/* son atendidas por los servidores de Netlify y reenviadas a Supabase con status 200
[[redirects]]
  from = "/supabase/*"
  to = "https://oyhlhdlubralrgjbgtqw.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/v1/*"
  to = "https://oyhlhdlubralrgjbgtqw.supabase.co/auth/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth-callback"
  to = "/.netlify/functions/auth-callback"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
